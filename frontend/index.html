<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智能数学函数图像绘制器</title>
  <script src="https://unpkg.com/function-plot/dist/function-plot.js"></script>
  <style>
    :root {
      --blue-deep: #1e3c72;
      --blue-bright: #2a5298;
      --blue-accent: #2f80ed;
      --yellow: #ffdf6c;
      --white: #ffffff;
      --glass: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.18);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 36px 20px 56px;
      color: var(--white);
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, var(--blue-deep) 0%, var(--blue-bright) 100%);
    }

    .page {
      width: min(1040px, 100%);
      margin: 0 auto;
    }

    header { text-align: center; margin-bottom: 24px; }
    h1 { margin: 0 0 12px; font-size: clamp(1.65rem, 4vw, 2.5rem); letter-spacing: .02em; }
    .notice { margin: 0; color: var(--yellow); font-size: .96rem; line-height: 1.6; }

    .controls {
      display: grid;
      grid-template-columns: minmax(180px, 1.2fr) minmax(200px, 1.6fr) minmax(110px, .7fr) auto;
      gap: 12px;
      align-items: end;
      padding: 18px;
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      background: var(--glass);
      box-shadow: 0 16px 40px rgba(10, 28, 70, .22);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .field { display: flex; flex-direction: column; gap: 7px; }
    label { font-size: .82rem; color: rgba(255,255,255,.82); }
    input, select, button {
      width: 100%;
      min-height: 44px;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 10px;
      font: inherit;
    }
    input, select {
      padding: 0 12px;
      color: #162b52;
      background: #fff;
      outline: none;
    }
    input:focus, select:focus { border-color: #9bc7ff; box-shadow: 0 0 0 3px rgba(155,199,255,.24); }
    button { cursor: pointer; padding: 0 18px; color: #fff; font-weight: 700; transition: transform .16s ease, filter .16s ease; }
    button:hover { filter: brightness(1.08); transform: translateY(-1px); }
    button:disabled { cursor: wait; opacity: .65; transform: none; }
    #drawButton { background: linear-gradient(135deg, #1769aa, #2f80ed); border-color: transparent; }

    .hint { margin: 11px 2px 0; color: rgba(255,255,255,.74); font-size: .78rem; }
    .status { min-height: 24px; margin: 16px 4px 8px; color: rgba(255,255,255,.88); font-size: .9rem; }
    .status.error { color: #ffd0d0; }
    .status.success { color: #c9ffdc; }

    .board-wrap { display: flex; justify-content: center; }
    .board {
      width: min(800px, 100%);
      min-height: 600px;
      padding: 0;
      overflow: hidden;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 20px 48px rgba(5, 20, 55, .34);
    }
    #plot { width: 100%; height: 600px; }
    #plot svg { display: block; width: 100%; height: 100%; }
    #plot .axis path, #plot .axis line { stroke: #8899b3; }
    #plot .axis text, #plot .tick text { fill: #49617f; font-size: 11px; }
    #plot .tip circle { fill: var(--blue-accent); }

    .download-row { display: flex; justify-content: center; margin-top: 18px; }
    #downloadButton { display: none; width: auto; min-width: 230px; background: linear-gradient(135deg, #159957, #31b56e); border-color: transparent; }

    @media (max-width: 760px) {
      body { padding: 24px 14px 40px; }
      .controls { grid-template-columns: 1fr 1fr; }
      .field:nth-child(2) { grid-column: span 2; }
      #drawButton { grid-column: span 2; }
      .board { min-height: 0; }
      #plot { height: min(600px, 72vw); min-height: 360px; }
    }
    @media (max-width: 460px) {
      .controls { grid-template-columns: 1fr; }
      .field:nth-child(2), #drawButton { grid-column: auto; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <h1>📈 智能数学函数图像绘制器</h1>
      <p class="notice">⚠️ 提示：由于使用免费云服务器，若长时间未访问，首次点击可能需要等待 30 秒唤醒服务。</p>
    </header>

    <section class="controls" aria-label="绘图控制面板">
      <div class="field">
        <label for="preset">常用函数</label>
        <select id="preset">
          <option value="">请选择一个函数…</option>
          <optgroup label="基础函数">
            <option value="x^2">x²</option>
            <option value="x^3 - 3*x">x³ - 3x</option>
            <option value="1/x">1/x</option>
            <option value="abs(x)">abs(x)</option>
          </optgroup>
          <optgroup label="三角函数">
            <option value="sin(x)">sin(x)</option>
            <option value="cos(x)">cos(x)</option>
            <option value="tan(x)">tan(x)</option>
          </optgroup>
          <optgroup label="指数与对数">
            <option value="e^x">eˣ</option>
            <option value="log(x)">log(x)</option>
            <option value="sqrt(x)">sqrt(x)</option>
          </optgroup>
        </select>
      </div>
      <div class="field">
        <label for="expr">函数表达式</label>
        <input id="expr" type="text" value="x^2" placeholder="例如：sin(x) + x^2" autocomplete="off" />
      </div>
      <div class="field">
        <label for="steps">点数（500–2000）</label>
        <input id="steps" type="number" value="500" min="500" max="2000" step="1" inputmode="numeric" />
      </div>
      <button id="drawButton" type="button">生成图像</button>
    </section>
    <p class="hint">点数越多曲线越细腻；为保障浏览器流畅度，点数会自动限制在 500 到 2000 之间。</p>

    <div id="status" class="status" role="status" aria-live="polite"></div>
    <div class="board-wrap">
      <section class="board" aria-label="函数图像画板">
        <div id="plot"></div>
      </section>
    </div>
    <div class="download-row">
      <button id="downloadButton" type="button">💾 下载高清图片</button>
    </div>
  </main>

  <script>
    (() => {
      const preset = document.getElementById('preset');
      const exprInput = document.getElementById('expr');
      const stepsInput = document.getElementById('steps');
      const drawButton = document.getElementById('drawButton');
      const downloadButton = document.getElementById('downloadButton');
      const status = document.getElementById('status');
      const plotEl = document.getElementById('plot');

      const clampSteps = () => {
        let value = Number.parseInt(stepsInput.value, 10);
        if (!Number.isFinite(value)) value = 500;
        value = Math.min(2000, Math.max(500, value));
        stepsInput.value = String(value);
        return value;
      };

      preset.addEventListener('change', () => {
        if (preset.value) exprInput.value = preset.value;
      });
      stepsInput.addEventListener('change', clampSteps);
      stepsInput.addEventListener('blur', clampSteps);

      const setStatus = (message, kind = '') => {
        status.textContent = message;
        status.className = `status ${kind}`.trim();
      };

      function renderPlot(points) {
        if (typeof functionPlot !== 'function') throw new Error('绘图库加载失败，请检查网络后重试。');
        plotEl.innerHTML = '';
        const width = Math.min(800, Math.max(320, plotEl.clientWidth || 800));
        const height = plotEl.clientHeight || 600;
        functionPlot({
          target: '#plot',
          width,
          height,
          grid: true,
          tip: { xLine: true, yLine: true },
          xAxis: { domain: [-20, 20] },
          yAxis: { domain: [-20, 20] },
          data: [{
            points: points.map(p => [Number(p.x), Number(p.y)]),
            fnType: 'points',
            graphType: 'polyline',
            color: '#2f80ed',
            attr: { 'stroke-width': 3 }
          }]
        });
        plotEl.querySelectorAll('path.line').forEach(path => path.setAttribute('stroke-width', '3'));
      }

      drawButton.addEventListener('click', async () => {
        const expr = exprInput.value.trim();
        const steps = clampSteps();
        if (!expr) {
          setStatus('请输入函数表达式后再生成。', 'error');
          exprInput.focus();
          return;
        }

        drawButton.disabled = true;
        downloadButton.style.display = 'none';
        setStatus('正在请求数据并绘制图像，请稍候…');
        try {
          const response = await fetch('https://function-plotter.onrender.com/plot', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ expr, x_min: -20, x_max: 20, steps })
          });
          if (!response.ok) throw new Error(`后端返回错误（${response.status}）`);
          const payload = await response.json();
          if (!payload || !Array.isArray(payload.points)) throw new Error('后端返回的数据格式不正确。');

          // 关键防崩机制：过滤 tan(x) 等函数的极端值，再交给 function-plot。
          const safePoints = payload.points.filter(p => p && Number.isFinite(Number(p.x)) && Number.isFinite(Number(p.y)) && Number(p.y) >= -100 && Number(p.y) <= 100);
          if (!safePoints.length) throw new Error('没有可绘制的有效点，请检查函数表达式。');
          renderPlot(safePoints);
          downloadButton.style.display = 'inline-block';
          setStatus(`绘制成功：已使用 ${safePoints.length} 个安全数据点。`, 'success');
        } catch (error) {
          setStatus(`生成失败：${error.message || '请稍后重试。'}`, 'error');
        } finally {
          drawButton.disabled = false;
        }
      });

      downloadButton.addEventListener('click', () => {
        const svg = plotEl.querySelector('svg');
        if (!svg) return;
        const canvas = document.createElement('canvas');
        canvas.width = 1600;
        canvas.height = 1200;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        const clone = svg.cloneNode(true);
        clone.setAttribute('width', '1600');
        clone.setAttribute('height', '1200');
        clone.setAttribute('viewBox', `0 0 ${svg.getBoundingClientRect().width || 800} ${svg.getBoundingClientRect().height || 600}`);
        clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
        const svgBlob = new Blob([new XMLSerializer().serializeToString(clone)], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(svgBlob);
        const image = new Image();
        image.onload = () => {
          ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(url);
          const link = document.createElement('a');
          link.download = '函数图像.png';
          link.href = canvas.toDataURL('image/png');
          link.click();
        };
        image.onerror = () => {
          URL.revokeObjectURL(url);
          setStatus('下载失败：无法转换当前图像。', 'error');
        };
        image.src = url;
      });
    })();
  </script>
</body>
</html>
